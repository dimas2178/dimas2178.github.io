<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litery NoRules - SCP Terminal</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 0; background-color: #0b0c10; color: #d1d7e0; overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
        }
        .header {
            text-align: center; padding: 40px 20px; background-color: #14171c;
            border-bottom: 3px solid #ff5400; box-shadow: 0 5px 25px rgba(0, 0, 0, 0.8); position: relative;
        }
        .header::before {
            content: "RESTRICTED ACCESS / TOP SECRET"; position: absolute; top: 10px; right: 20px;
            font-size: 0.75rem; color: #ff5400; font-weight: bold; letter-spacing: 2px; border: 1px solid #ff5400; padding: 2px 6px;
        }
        .project-icon {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background-color: transparent;
            object-fit: contain;
            padding: 10px;
            border: 2px dashed #ff5400;
            box-shadow: 0 0 20px rgba(255, 84, 0, 0.2);
            margin-bottom: 15px;
            transition: all 0.3s ease;
            mix-blend-mode: screen; 
        }

        .project-icon:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 84, 0, 0.4); border-style: solid; }
        .header h1 { margin: 0; font-size: 2.4rem; font-weight: bold; letter-spacing: 3px; color: #ffffff; text-transform: uppercase; }
        .header p { margin: 8px 0 0 0; color: #7a828e; font-size: 1rem; letter-spacing: 4px; text-transform: uppercase; }
        .main-container { max-width: 1240px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 360px 1fr; gap: 30px; }
        .plugin-list { display: flex; flex-direction: column; gap: 12px; }
        .plugin-item {
            padding: 16px 20px; background: #14171c; border: 1px solid #282e38; border-left: 4px solid #4a525d;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: all 0.2s ease; color: #a2aab7; text-transform: uppercase; letter-spacing: 1px;
        }
        .plugin-item:hover { background: #1c2128; color: #ffffff; border-left-color: #ffffff; padding-left: 25px; }
        .plugin-item.active { background: #1e1b18; color: #ff5400; border-color: #ff5400; border-left: 6px solid #ff5400; text-shadow: 0 0 8px rgba(255, 84, 0, 0.4); }
        .plugin-details { background: #0d0f12; border: 2px solid #14171c; padding: 40px; border-radius: 4px; min-height: 420px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .details-content { display: none; animation: glitchOpen 0.3s ease; }
        @keyframes glitchOpen { 0% { opacity: 0; transform: scaleY(0.98); } 100% { opacity: 1; transform: scaleY(1); } }
        .plugin-title { margin-top: 0; font-size: 1.8rem; font-weight: bold; color: #ffffff; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px dashed #14171c; padding-bottom: 15px; }
        .plugin-desc { font-size: 1.05rem; line-height: 1.8; color: #b0b8c4; margin-bottom: 35px; }
        code { background: #14171c; color: #38ef7d; padding: 4px 8px; border-radius: 2px; font-family: monospace; font-size: 1rem; border: 1px solid #282e38; }
        .stat-green { color: #38ef7d; font-weight: bold; border-bottom: 1px dashed #38ef7d; }
        .plugin-image { max-width: 100%; height: auto; border-radius: 2px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); border: 1px solid #14171c; display: none; }
        .placeholder-text { color: #4a525d; font-size: 1.1rem; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } .header h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>

    <header class="header">
        <img class="project-icon" src="NoRules.jpg" alt="Иконка проекта">
        <h1>Плагины Litery NoRules</h1>
        <p>Спецификация модулей комплекса</p>
    </header>
    <div class="main-container">
        <!-- Список плагинов -->
        <div class="plugin-list">
            <div class="plugin-item" onclick="selectPlugin(this, 1)">Двери без карты</div>
            <div class="plugin-item" onclick="selectPlugin(this, 2)">Двери выстрелом</div>
            <div class="plugin-item" onclick="selectPlugin(this, 3)">SCP-457 Огненный человек</div>
            <div class="plugin-item" onclick="selectPlugin(this, 4)">SCP-1162 Дыра в стене</div>
            <div class="plugin-item" onclick="selectPlugin(this, 5)">Монетка судьбы</div>
            <div class="plugin-item" onclick="selectPlugin(this, 6)">SCPSWAP консоль</div>
            <div class="plugin-item" onclick="selectPlugin(this, 7)">Чат наблюдателей</div>
        </div>

        <!-- Описание плагинов -->
        <div class="plugin-details">
            <div id="placeholder" class="placeholder-text">
                [ ОЖИДАНИЕ ВЫБОРА МОДУЛЯ ДЛЯ ВЫВОДА ДАННЫХ ]
            </div>
            
            <div id="details-content" class="details-content">
                <h2 id="plugin-title" class="plugin-title"></h2>
                <p id="plugin-desc" class="plugin-desc"></p>
                <img id="plugin-img" class="plugin-image" src="" alt="Скриншот">
            </div>
        </div>
    </div>

    <script>
        // Скриншот для SCP-1162 (id: 4) полностью удален из базы данных
        var db = {
            1: {
                t: "Автоматический обход шлюзов (без карты в руках)",
                d: "Позволяет открывать доступные вам двери автоматически, даже если нужная ключ-карта просто лежит в вашем инвентаре. Больше не нужно тратить время на её экипировку в опасных ситуациях.",
                i: "" 
            },
            2: {
                t: "Тактический взлом дверей выстрелом",
                d: "Добавляет механику тактического открытия дверей. Обычные двери можно мгновенно открыть или закрыть, просто метко выстрелив по кнопке панели управления.",
                i: "" 
            },
            3: {
                t: "Объект SCP-457 - Огненный человек",
                d: "Добавляет на сервер играбельный объект SCP-457 со следующими механиками:<br><br>• <strong>Урон по области:</strong> наносит повреждения окружающим. Чем ближе вы находитесь к цели — тем больше урона она получает.<br>• <span class='stat-green'>Восстановление здоровья:</span> восстанавливает по <code>60 HP</code> за каждое совершенное убийство.<br>• <strong>Характеристики:</strong> имеет запас в <code>2200 HP</code> и <code>550 единиц щита</code>.<br>• <strong>Аварийный бафф:</strong> если уровень здоровья опускается до <code>1000 HP</code> или ниже, прочность щита автоматически увеличивается до <code>1000 единиц</code>.",
                i: "scp457.png" 
            },
            4: {
                t: "Аномальный объект SCP-1162 - Дыра в стене",
                d: "Удобный обменник предметов прямо на сервере. Вы можете бесконечно обменивать свои вещи на случайные другие, при этом игрок абсолютно защищен — он не теряет здоровье и не получает никаких негативных эффектов. Единственное исключение: <span style='color:#ff5400; font-weight:bold;'>патроны обменивать нельзя</span>.",
                i: "" 
            },
            5: {
                t: "Аномальный протокол: Монетка судьбы",
                d: "Обычная игровая монетка превращается в рулетку судьбы! При подбрасывании монетки с определенным шансом вас либо мгновенно телепортирует в случайное место на карте комплекса, либо она взорвется прямо у вас в руках.",
                i: "Coin.png" 
            },
            6: {
                t: "Консольный протокол: SCPSWAP",
                d: "Плагин позволяет игрокам в начале раунда обмениваться ролями SCP. Чтобы отправить запрос, откройте игровую консоль (нажатием на кнопку <code>Ё</code> / <code>~</code>) и введите команду.<br><br><strong>Примеры использования:</strong><br>• <code>scpswap scp049</code><br>• <code>ss scp049</code>",
                i: "" 
            },
            7: {
                t: "Система связи: Фильтрация чата",
                d: "Удобная функция общения через консоль. Откройте консоль на кнопку <code>Ё</code> (тильда) и используйте специальный префикс для отправки сообщения.<br><br><strong>Как общаться:</strong><br>Введите в консоль: <code>.s [текст сообщения]</code><br><br><span style='color:#ff5400;'><strong>Протокол безопасности:</strong></span> Живые игроки гарантированно не видят сообщения от наблюдателей (мертвых игроков).",
                i: "Chat.png" 
            }
        };

        function selectPlugin(element, id) {
            var items = document.getElementsByClassName('plugin-item');
            for (var i = 0; i < items.length; i++) { items[i].classList.remove('active'); }
            element.classList.add('active');
            
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('details-content').style.display = 'block';
            
            var data = db[id];
            document.getElementById('plugin-title').innerHTML = data.t;
            document.getElementById('plugin-desc').innerHTML = data.d;
            
            var imgBlock = document.getElementById('plugin-img');
            if (data.i !== "") {
                imgBlock.src = data.i;
                imgBlock.style.display = "block";
            } else {
                imgBlock.style.display = "none";
                imgBlock.src = "";
            }
        }
    </script>
</body>
</html>
